
name: CI

on:
  pull_request:
    branches:
      - main
      - test/CI
      - develop
  push:
    branches: 
      - main
      - test/CI
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Compilar bibliotecas
        run: make all

      - name: Instalar o Programa
        run: sudo make install

      - name: Executar testes
        run: make test
